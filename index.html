<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>jura.tw</title>
    <meta name="description" content="提供學習與研究臺灣法律的開放工具。">

    <!-- Pico.css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css"
    >
	
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
	<link rel="manifest" href="favicon/site.webmanifest" />
	
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "jura.tw",
      "url": "https://jura.tw/"
    }
  </script>
  </head>

  <body>
    <!-- Header -->
    <header>
      <hgroup>
        <h1>jura.tw</h1>
        <p>學習與研究臺灣法律的開放工具。</p>
      </hgroup>
    </header>
    <!-- ./ Header -->

    <!-- Main -->
    <main>

      <!-- Typography-->
      <section id="typography">
        <h2>專案</h2>
        <p>
          <a href="https://jura.tw/statute-reader">雲端法條本</a>：以全國法規資料庫為資料來源，提供常用國考法條的快速、純靜態網頁閱讀介面。
        </p>

        <!-- Lists-->
        <h4>法學引註</h4>
        <ul>
          <li><a href="https://legalcite.zhenhuang.tw/">TSSCI Tier 1 法學引註格式檢索</a>：以網頁形式呈現臺灣 TSSCI 一級法學期刊共同制定之引註格式，讓使用者無需查閱 PDF 即可快速瀏覽各類文獻的引用規範</li>
          <li><a href="https://github.com/jura-tw/public-law-csl">public-law-csl</a>：環境能源法學會《公法研究》期刊的非官方 CSL 檔案</li>
        </ul>
      </section>
      <!-- ./ Typography-->
	  
      <!-- Article-->
      <article id="article">
        <h2>理念</h2>
        <ul>
          <li>可及性</li>
          <li>開放</li>
          <li>互通（可攜性）</li>
        </ul>
        <footer>
          <small>jura.tw</small>
        </footer>
      </article>
      <!-- ./ Article-->
    </main>
    <!-- ./ Main -->

    <!-- Footer -->
    <footer>
      <small
        >UI: <a href="https://picocss.com">Pico CSS</a> •
        <a href="https://github.com/jura-tw/jura-tw.github.io"
          >Source code</a
        ></small>
    </footer>
    <!-- ./ Footer -->
  </body>
</html>
